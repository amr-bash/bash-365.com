# Publish approved LinkedIn drafts to the BASH company page.
#
# The lane lives in zer0-CMS (docs/DISTRIBUTION.md there); this file only calls
# its reusable workflow. Settings are in zer0.json ("distribution.linkedin");
# credentials are the LINKEDIN_* Actions secrets.
#
#   * push to main under drafts/linkedin/** — a merged draft. The merge IS the
#     approval (zer0.json accepts pending and approved), so this runs live.
#     With the cadence in zer0.json, a merged draft waits for its slot.
#   * schedule — the slot hours: Tuesday and Thursday 09:00 in Denver is 15:00
#     UTC in summer and 16:00 in winter, so the run comes at :17 past 15, 16
#     and 17 UTC; the lane releases at most one draft per open slot and only
#     once its page has been on main for afterPage. Change this with the slots.
#   * workflow_dispatch — rehearse the queue, or one draft, and publish it only
#     when "live" is ticked.
#
# Every share is a draft a person merged: there is no free-text or
# post-by-reference input. A live run without LINKEDIN_ACCESS_TOKEN skips with a
# notice. The ledger (.github/linkedin-log.json) and the draft's new status are
# committed back with [skip ci]. Issues are disabled on this repository, so a
# failed run and its job summary are the alert.

name: LinkedIn publish

on:
  push:
    branches: [main]
    paths: ['drafts/linkedin/**']
  schedule:
    - cron: '17 15,16,17 * * 2,4' # the cadence's slots, Tue and Thu 09:00 America/Denver
  workflow_dispatch:
    inputs:
      draft:
        description: 'One draft id (a file under drafts/linkedin, without .md); empty for the whole queue'
        type: string
        required: false
        default: ''
      live:
        description: 'Publish to LinkedIn (unticked: rehearse only)'
        type: boolean
        default: false

# The reusable job commits the ledger and the draft's status back.
permissions:
  contents: write

concurrency:
  group: linkedin-publish
  cancel-in-progress: false

jobs:
  publish:
    uses: bamr87/zer0-CMS/.github/workflows/zer0-linkedin.yml@main
    with:
      command: publish
      draft: ${{ inputs.draft || '' }}
      live: ${{ github.event_name != 'workflow_dispatch' || inputs.live == true }}
    # By name, not `secrets: inherit`: GitHub passes inherited secrets only to a
    # reusable workflow in the same organization or enterprise, and this one
    # lives in the bamr87 account, so `inherit` passed nothing.
    secrets:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
